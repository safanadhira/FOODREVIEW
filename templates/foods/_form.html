{{ define "foods/_form.html" }}

<form action="{{ .Action }}" method="POST" class="container">

    {{ if eq .Method "PUT" }}
        <input type="hidden" name="_method" value="PUT">
    {{ end }}

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" name="name" value="{{ .Food.Name }}" required>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea name="description">{{ .Food.Description }}</textarea>
    </div>

    <div class="form-group">
        <label for="price">Price</label>
        <input type="number" name="price" step="0.01" value="{{ .Food.Price }}" required>
    </div>

    <button type="submit" class="btn">
        {{ .ButtonText }}
    </button>
</form>

{{ end }}
