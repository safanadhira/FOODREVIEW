{{ define "restaurants/create.html" }}

{{ template "layouts/header.html" . }}

<div class="container">
    <h2>Add New Restaurant</h2>

    <form action="/restaurants" method="POST" enctype="multipart/form-data">
        <label for="name">Restaurant Name</label>
        <input type="text" name="name" required>

        <label for="description">Description</label>
        <textarea name="description"></textarea>

        <label for="image_upload_field">Images</label>
        <input type="file" name="image_upload_field" accept="image/jpeg, image/png, image/jpg" />

        <button type="submit" class="btn">Create Restaurant</button>
    </form>
</div>

{{ template "layouts/footer.html" . }}

{{ end }}
